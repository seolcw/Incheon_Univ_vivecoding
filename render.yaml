services:
  - type: web
    name: bingang-api
    branch: be-a
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: STORAGE
        value: firestore
      - key: CAMPUS_SOURCE
        value: seed
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TZ
        value: Asia/Seoul
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: bingang-web
    branch: be-a
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_USE_MOCK
        value: "0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
