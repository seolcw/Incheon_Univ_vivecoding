services:
  - type: web
    name: bingang-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: STORAGE
        value: memory
      - key: TZ
        value: Asia/Seoul
      - key: CORS_ORIGINS
        sync: false
